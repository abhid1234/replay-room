previews:
  generation: manual
  expireAfterDays: 3

services:
  - type: web
    name: replay-room-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/api/server.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    preDeployCommand: node dist/db/migrate.js
    envVars: &app-env
      - key: DATABASE_URL
        fromDatabase:
          name: replay-room-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: replay-room-queue
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: EVIDENCE_SIGNING_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: MAX_PAYLOAD_BYTES
        value: "262144"
      - key: RETENTION_DAYS
        value: "30"

  - type: worker
    name: replay-room-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    autoDeployTrigger: checksPass
    envVars: *app-env

  - type: cron
    name: replay-room-reconciler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/cron.js
    schedule: "*/10 * * * *"
    envVars: *app-env

  - type: web
    name: replay-room-web
    runtime: static
    buildCommand: npm ci && npm --workspace web run build
    staticPublishPath: ./web/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false

  - type: keyvalue
    name: replay-room-queue
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: replay-room-db
    plan: free
    databaseName: replay_room
    user: replay_room
    ipAllowList: []
