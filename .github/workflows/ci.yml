name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: replay-room-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  production-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build-time tooling processes repository input and ships the static console,
      # so high-severity advisories in dev dependencies are release blockers too.
      - run: npm audit --audit-level=high

  managed-services:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: replay_room
          POSTGRES_PASSWORD: replay_room
          POSTGRES_DB: replay_room_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replay_room -d replay_room_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://replay_room:replay_room@127.0.0.1:5432/replay_room_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  container:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag replay-room:${{ github.sha }} .
