name: live deployment smoke

on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      api_url:
        description: Public Replay Room API origin
        required: true
        default: https://replay-room-api.onrender.com
        type: string
      site_url:
        description: Public Replay Room console origin
        required: true
        default: https://replay-room-web.onrender.com
        type: string
      space_url:
        description: Public Replay Room Hugging Face Space origin
        required: true
        default: https://abhid1234-replay-room.static.hf.space
        type: string
      expected_version:
        description: Expected deployed OpenAPI version
        required: true
        default: 0.1.1
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API_URL: ${{ inputs.api_url || 'https://replay-room-api.onrender.com' }}
      SITE_URL: ${{ inputs.site_url || 'https://replay-room-web.onrender.com' }}
      SPACE_URL: ${{ inputs.space_url || 'https://abhid1234-replay-room.static.hf.space' }}
      EXPECTED_VERSION: ${{ inputs.expected_version || '0.1.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify live Render and Hugging Face deployments
        run: npm run smoke:live -- --api "$API_URL" --site "$SITE_URL" --space "$SPACE_URL" --expected-version "$EXPECTED_VERSION"
